/* ============================================================
   Catppuccin Mocha tokens
   ============================================================ */
:root {
  --rosewater: #f5e0dc; --flamingo: #f2cdcd; --pink: #f5c2e7; --mauve: #cba6f7;
  --red: #f38ba8; --maroon: #eba0ac; --peach: #fab387; --yellow: #f9e2af;
  --green: #a6e3a1; --teal: #94e2d5; --sky: #89dceb; --sapphire: #74c7ec;
  --blue: #89b4fa; --lavender: #b4befe;
  --text: #cdd6f4; --subtext1: #bac2de; --subtext0: #a6adc8;
  --overlay2: #9399b2; --overlay1: #7f849c; --overlay0: #6c7086;
  --surface2: #585b70; --surface1: #45475a; --surface0: #313244;
  --base: #1e1e2e; --mantle: #181825; --crust: #11111b;

  --accent: var(--mauve);
  --accent-soft: color-mix(in srgb, var(--accent) 16%, transparent);
  --glass: rgba(17, 17, 27, .42);
  --glass-strong: rgba(24, 24, 37, .62);
  --glass-win: rgba(30, 30, 46, .68);
  --blur: blur(28px) saturate(160%);
  --hairline: rgba(205, 214, 244, .07);
  --hairline-2: rgba(205, 214, 244, .11);
  --shadow: 0 18px 50px rgba(0, 0, 0, .45), 0 2px 8px rgba(0, 0, 0, .25);

  --ui: 'Quicksand', system-ui, sans-serif;
  --mono: 'JetBrainsMono Nerd Font', 'JetBrains Mono', ui-monospace, monospace;
  --bar-h: 36px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: var(--ui); font-size: 13px; font-weight: 500; color: var(--text);
  background: var(--crust); -webkit-font-smoothing: antialiased;
  user-select: none;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: default; }
input { font: inherit; color: inherit; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.ic { flex: none; display: block; }

/* ============================================================
   Wallpaper
   ============================================================ */
#wallpaper { position: fixed; inset: 0; transition: background .6s ease; }
body[data-wall="mocha"] #wallpaper {
  background:
    radial-gradient(1200px 700px at 78% 112%, color-mix(in srgb, var(--accent) 30%, transparent), transparent 60%),
    radial-gradient(900px 600px at 8% -10%, rgba(137, 180, 250, .10), transparent 60%),
    linear-gradient(180deg, #151521 0%, #11111b 100%);
}
body[data-wall="mocha"] #wallpaper::after {
  content: ""; position: absolute; inset: 0; opacity: .5;
  background-image: radial-gradient(rgba(205,214,244,.06) 1px, transparent 1px);
  background-size: 28px 28px;
  mask-image: linear-gradient(180deg, transparent, #000 40%, #000 70%, transparent);
}

body[data-wall="plain"] #wallpaper { background: var(--crust); }
body[data-wall="dusk"] #wallpaper { background: radial-gradient(1000px 600px at 50% 120%, rgba(250,179,135,.20), transparent 60%), linear-gradient(180deg,#1b1726,#11111b); }
body[data-wall="ocean"] #wallpaper { background: radial-gradient(1000px 700px at 20% 110%, rgba(116,199,236,.22), transparent 60%), linear-gradient(180deg,#121826,#11111b); }
body[data-wall="forest"] #wallpaper { background: radial-gradient(1100px 700px at 80% 0%, rgba(166,227,161,.14), transparent 60%), linear-gradient(180deg,#121a17,#11111b); }
body[data-wall="rose"] #wallpaper { background: radial-gradient(1100px 700px at 50% -20%, rgba(245,194,231,.18), transparent 60%), linear-gradient(180deg,#1c1520,#11111b); }

/* ============================================================
   Top bar
   ============================================================ */
#bar {
  position: fixed; z-index: 100; top: 8px; left: 10px; right: 10px; height: var(--bar-h);
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  padding: 0 6px; border-radius: 12px;
  background: var(--glass); border: 1px solid var(--hairline);
  backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  box-shadow: 0 6px 24px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.05);
  transition: top .3s cubic-bezier(.2,.8,.2,1), left .3s cubic-bezier(.2,.8,.2,1), right .3s cubic-bezier(.2,.8,.2,1), border-radius .3s, box-shadow .3s;
}
/* Full-size app on screen: bar sticks to the screen edges, no margin or rounding */
body.bar-flush #bar { top: 0; left: 0; right: 0; border-radius: 0; border-width: 0 0 1px; box-shadow: none; }
body.bar-flush .panel { top: calc(var(--bar-h) + 6px); }
.bar-left, .bar-right { display: flex; align-items: center; gap: 2px; min-width: 0; }
.bar-right { justify-content: flex-end; }

.bar-btn {
  height: 26px; padding: 0 9px; border-radius: 8px;
  display: inline-flex; align-items: center; gap: 6px;
  color: var(--subtext1); transition: background .15s, color .15s;
}
.bar-btn:hover { background: rgba(205,214,244,.07); color: var(--text); }
.bar-btn.active { background: var(--surface0); color: var(--text); box-shadow: inset 0 0 0 1px var(--hairline-2); }

.arch-btn { color: var(--blue); padding: 0 10px; }
.arch-btn:hover, .arch-btn.active { color: var(--sky); }

.workspaces { display: flex; align-items: center; gap: 3px; margin: 0 6px 0 2px; padding: 3px; border-radius: 9px; background: rgba(17,17,27,.55); }
.ws {
  min-width: 21px; height: 20px; padding: 0 6px; border-radius: 6px;
  font: 600 11px/18px var(--mono); text-align: center; color: var(--overlay1);
  position: relative; transition: all .2s;
}
.ws.occupied { color: var(--subtext1); }
.ws.occupied::after { content: ""; position: absolute; left: 50%; bottom: 1px; width: 3px; height: 3px; margin-left: -1.5px; border-radius: 50%; background: var(--overlay1); }
.ws:hover { background: var(--surface0); color: var(--text); }
.ws.active { background: var(--accent); color: var(--crust); min-width: 30px; }
.ws.active::after { display: none; }

.app-name { font-weight: 700; color: var(--text); padding: 0 8px 0 6px; white-space: nowrap; letter-spacing: -.01em; }
.app-menu { display: flex; align-items: center; }
.app-menu .bar-btn { padding: 0 8px; color: var(--subtext1); font-weight: 500; }

.stats-chip { font-family: var(--mono); font-size: 11.5px; gap: 0; padding: 0 4px; }
.stat-pill { display: inline-flex; align-items: center; gap: 5px; padding: 0 7px; height: 20px; border-radius: 6px; }
.stat-pill + .stat-pill { border-left: 1px solid var(--hairline-2); border-radius: 0; }
.stat-pill .pct { color: var(--text); font-weight: 600; }
.stat-pill .tmp { color: var(--overlay2); }
.stat-pill .tmp.warm { color: var(--peach); }
.stat-pill .tmp.hot { color: var(--red); }
.stat-pill.cpu .ic { color: var(--blue); }
.stat-pill.ram .ic { color: var(--green); }
.stat-pill.gpu .ic { color: var(--peach); }

.icon-btn { padding: 0 8px; }
.icon-btn.off { color: var(--overlay0); }
.clock { font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--text); padding: 0 11px; letter-spacing: -.01em; }
.clock .time { color: var(--accent); margin-left: 8px; }

/* ============================================================
   Panels & menus
   ============================================================ */
#panelLayer { position: fixed; inset: 0; z-index: 90; pointer-events: none; }
.panel {
  position: absolute; pointer-events: auto;
  top: calc(var(--bar-h) + 14px);
  background: var(--glass-strong); border: 1px solid var(--hairline-2);
  backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  border-radius: 14px; box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.05);
  animation: pop .16s cubic-bezier(.2,.9,.3,1.2);
  transform-origin: top center;
}
@keyframes pop { from { opacity: 0; transform: translateY(-6px) scale(.98); } }

/* macOS-style menus */
.menu { padding: 5px; min-width: 240px; font-size: 13px; }
.menu-item {
  display: flex; align-items: center; gap: 10px; height: 26px; padding: 0 10px;
  border-radius: 6px; color: var(--text); white-space: nowrap; position: relative;
}
.menu-item .mi-icon { color: var(--overlay2); width: 15px; display: flex; justify-content: center; }
.menu-item .kbd { margin-left: auto; padding-left: 24px; font-family: var(--mono); font-size: 11px; color: var(--overlay1); letter-spacing: .04em; }
.menu-item .sub { margin-left: auto; color: var(--overlay1); }
.menu-item.disabled { color: var(--overlay0); }
.menu-item:not(.disabled):hover, .menu-item.open {
  background: var(--accent); color: var(--crust);
}
.menu-item:not(.disabled):hover > .kbd, .menu-item:not(.disabled):hover > .sub, .menu-item:not(.disabled):hover > .mi-icon,
.menu-item.open > .kbd, .menu-item.open > .sub, .menu-item.open > .mi-icon { color: var(--crust); opacity: .75; }
.menu-sep { height: 1px; margin: 5px 10px; background: var(--hairline-2); }
.menu-head { padding: 6px 10px 4px; font-size: 11px; font-weight: 600; color: var(--overlay1); text-transform: uppercase; letter-spacing: .06em; }
.submenu { position: absolute; left: calc(100% + 6px); top: -5px; }

/* Generic panel bits */
.pnl { padding: 14px; width: 340px; }
.pnl-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.pnl-head h3 { font-size: 14px; font-weight: 700; letter-spacing: -.01em; }
.pnl-head .meta { margin-left: auto; color: var(--overlay1); font-size: 11.5px; }
.pnl-sec { font-size: 11px; font-weight: 600; color: var(--overlay1); text-transform: uppercase; letter-spacing: .06em; margin: 14px 2px 6px; }
.pnl-foot { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--hairline-2); display: flex; gap: 8px; }
.link-btn { padding: 6px 8px; border-radius: 7px; color: var(--subtext1); font-weight: 500; }
.link-btn:hover { background: var(--surface0); color: var(--text); }

.list { display: flex; flex-direction: column; gap: 2px; }
.li { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 9px; }
.li:hover { background: rgba(205,214,244,.05); }
.li .li-ic { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--surface0); color: var(--subtext1); }
.li.on .li-ic { background: var(--accent); color: var(--crust); }
.li .li-txt { display: flex; flex-direction: column; min-width: 0; }
.li .li-t { font-weight: 500; }
.li .li-s { font-size: 11.5px; color: var(--overlay1); }
.li .li-r { margin-left: auto; color: var(--overlay1); display: flex; align-items: center; gap: 8px; font-size: 11.5px; }

/* Toggle switch */
.switch { display: block; width: 34px; height: 20px; border-radius: 99px; background: var(--surface1); position: relative; transition: background .2s; flex: none; cursor: default; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.4); transition: transform .2s; }
.switch.on { background: var(--accent); }
.switch.on::after { transform: translateX(14px); background: var(--crust); }

/* Slider */
.slider-row { display: flex; align-items: center; gap: 10px; }
.slider-row .ic { color: var(--subtext0); }
.slider-row .val { width: 38px; text-align: right; color: var(--subtext0); font-family: var(--mono); font-size: 11.5px; }
input[type=range] {
  -webkit-appearance: none; appearance: none; flex: 1; height: 22px; background: transparent;
}
input[type=range]::-webkit-slider-runnable-track {
  height: 8px; border-radius: 99px;
  background: linear-gradient(90deg, var(--accent) 0 var(--p, 50%), var(--surface0) var(--p, 50%) 100%);
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 18px; height: 18px; margin-top: -5px; border-radius: 50%;
  background: var(--text); box-shadow: 0 0 0 3px var(--base), 0 2px 6px rgba(0,0,0,.4);
}
input[type=range]::-moz-range-track { height: 8px; border-radius: 99px; background: var(--surface0); }
input[type=range]::-moz-range-progress { height: 8px; border-radius: 99px; background: var(--accent); }
input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border: 0; border-radius: 50%; background: var(--text); }

/* Stats panel */
.stats { width: 440px; padding: 14px; }
.stat-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat-card { background: rgba(49,50,68,.55); border: 1px solid var(--hairline); border-radius: 12px; padding: 10px 11px; }
.stat-card .sc-top { display: flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; color: var(--subtext0); }
.stat-card .sc-big { font: 700 22px/1.1 var(--mono); margin-top: 8px; letter-spacing: -.02em; }
.stat-card .sc-big small { font-size: 12px; color: var(--overlay1); font-weight: 500; }
.stat-card .sc-sub { font: 500 11px var(--mono); color: var(--overlay1); margin-top: 3px; display: flex; align-items: center; gap: 4px; }
.bar-track { height: 5px; border-radius: 99px; background: var(--surface0); overflow: hidden; margin-top: 9px; }
.bar-fill { height: 100%; border-radius: 99px; transition: width .6s ease; }
.cores { display: grid; grid-template-columns: repeat(20, 1fr); gap: 3px; align-items: end; height: 34px; margin-top: 8px; }
.core { background: var(--surface0); border-radius: 2px; position: relative; height: 100%; overflow: hidden; }
.core i { position: absolute; left: 0; right: 0; bottom: 0; background: var(--blue); border-radius: 2px; transition: height .6s; }
.core.e i { background: var(--sapphire); opacity: .75; }
.spark { width: 100%; height: 54px; display: block; margin-top: 6px; }
.kv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.kv { background: rgba(49,50,68,.4); border-radius: 10px; padding: 8px 10px; display: flex; align-items: center; gap: 8px; }
.kv .ic { color: var(--overlay2); }
.kv .k { font-size: 11px; color: var(--overlay1); }
.kv .v { font: 600 12px var(--mono); }
.proc { display: grid; grid-template-columns: 1fr 60px 70px; gap: 4px 8px; font: 500 11.5px var(--mono); }
.proc .h { color: var(--overlay1); font-family: var(--ui); font-size: 11px; font-weight: 600; }
.proc .r { text-align: right; color: var(--subtext0); }

/* Quick settings */
.qs { width: 360px; padding: 14px; }
.qs-user { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; color: var(--crust); background: linear-gradient(135deg, var(--accent), var(--blue)); flex: none; }
.qs-user .who { display: flex; flex-direction: column; }
.qs-user .who b { font-weight: 600; }
.qs-user .who span { font-size: 11.5px; color: var(--overlay1); }
.qs-user .acts { margin-left: auto; display: flex; gap: 4px; }
.round-btn { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--surface0); color: var(--subtext1); }
.round-btn:hover { background: var(--surface1); color: var(--text); }
.round-btn.danger:hover { background: var(--red); color: var(--crust); }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile { display: flex; align-items: center; gap: 10px; padding: 10px 11px; border-radius: 12px; background: rgba(49,50,68,.6); border: 1px solid var(--hairline); text-align: left; transition: background .15s; }
.tile:hover { background: var(--surface0); }
.tile .t-ic { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--surface1); color: var(--subtext1); flex: none; }
.tile .t-l { font-weight: 600; font-size: 12.5px; display: block; }
.tile .t-s { font-size: 11px; color: var(--overlay1); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile.on { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
.tile.on .t-ic { background: var(--accent); color: var(--crust); }
.tile.on .t-s { color: var(--subtext0); }
.qs-sliders { display: flex; flex-direction: column; gap: 4px; margin-top: 12px; padding: 8px 10px; border-radius: 12px; background: rgba(49,50,68,.4); }
.media { display: flex; align-items: center; gap: 12px; margin-top: 12px; padding: 10px; border-radius: 12px; background: linear-gradient(135deg, rgba(203,166,247,.14), rgba(137,180,250,.08)); border: 1px solid var(--hairline); }
.cover { width: 46px; height: 46px; border-radius: 9px; background: linear-gradient(160deg, var(--peach), var(--pink) 50%, var(--mauve)); flex: none; position: relative; overflow: hidden; }
.cover::after { content: ""; position: absolute; left: -10%; right: -10%; bottom: 0; height: 40%; background: rgba(17,17,27,.55); border-radius: 50% 50% 0 0; }
.media .m-t { font-weight: 600; }
.media .m-s { font-size: 11.5px; color: var(--overlay1); }
.media .m-prog { height: 3px; border-radius: 99px; background: var(--surface1); margin-top: 6px; overflow: hidden; }
.media .m-prog i { display: block; height: 100%; width: 42%; background: var(--accent); }
.media .m-ctl { margin-left: auto; display: flex; gap: 2px; }
.media .m-ctl button { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: var(--subtext1); }
.media .m-ctl button:hover { background: var(--surface0); color: var(--text); }

/* Calendar */
.cal { width: 300px; padding: 14px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; font: 500 12px var(--mono); }
.cal-grid .dow { font: 600 10.5px var(--ui); color: var(--overlay1); padding: 4px 0; }
.cal-grid .d { padding: 6px 0; border-radius: 7px; color: var(--subtext1); }
.cal-grid .d.mute { color: var(--surface2); }
.cal-grid .d.we { color: var(--overlay2); }
.cal-grid .d.today { background: var(--accent); color: var(--crust); font-weight: 700; }
.cal-grid .d:not(.today):hover { background: var(--surface0); }
.event { display: flex; gap: 10px; padding: 8px 10px; border-radius: 9px; background: rgba(49,50,68,.45); margin-top: 6px; }
.event i { width: 3px; border-radius: 3px; background: var(--accent); }
.event b { font-weight: 600; display: block; }
.event span { font-size: 11.5px; color: var(--overlay1); }

/* ============================================================
   Windows
   ============================================================ */
#desktop { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
.win {
  position: absolute; display: flex; flex-direction: column;
  background: var(--glass-win); border: 1px solid var(--hairline-2); border-radius: 14px;
  backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.05); overflow: hidden; pointer-events: auto;
  animation: winIn .22s cubic-bezier(.2,.9,.3,1.1);
  transition: opacity .32s ease, transform .4s cubic-bezier(.2,.8,.2,1), visibility 0s;
}
.win.ws-off { opacity: 0; transform: translateY(var(--ws-y, 80px)); visibility: hidden; pointer-events: none;
  transition: opacity .28s ease, transform .4s cubic-bezier(.2,.8,.2,1), visibility 0s .4s; }
.win.focused { border-color: color-mix(in srgb, var(--accent) 55%, transparent); box-shadow: var(--shadow), 0 0 0 1px color-mix(in srgb, var(--accent) 25%, transparent); }
@keyframes winIn { from { opacity: 0; transform: scale(.97); } }
.win.closing { animation: winOut .16s ease forwards; }
@keyframes winOut { to { opacity: 0; transform: scale(.97); } }
.titlebar { height: 40px; display: flex; align-items: center; padding: 0 14px; gap: 10px; flex: none; }
.lights { display: flex; gap: 8px; }
.lights span { width: 12px; height: 12px; border-radius: 50%; display: grid; place-items: center; }
.lights .l-close { background: var(--red); }
.lights .l-min { background: var(--yellow); }
.lights .l-max { background: var(--green); }
.win:not(.focused) .lights span { background: var(--surface1); }
.lights:hover span svg { opacity: 1; }
.lights span svg { opacity: 0; color: rgba(17,17,27,.7); }
.titlebar .t-title { flex: 1; text-align: center; font-weight: 600; color: var(--subtext0); font-size: 12.5px; margin-right: 54px; }

/* Ghostty (tiled niri column) */
.term .titlebar, .app .titlebar { background: rgba(17,17,27,.30); border-bottom: 1px solid var(--hairline); }
.term-body { flex: 1; padding: 14px 18px; font: 13px/1.5 var(--mono); overflow: hidden; }
.ff { display: flex; gap: 26px; margin-top: 8px; }
.ff-logo { color: var(--blue); font-size: 0; }
.ff-info div { white-space: pre; }
.ff-info .k { color: var(--blue); font-weight: 700; }
.ff-info .u { color: var(--mauve); font-weight: 700; }
.prompt .p1 { color: var(--accent); font-weight: 700; }
.prompt .p2 { color: var(--blue); }
.prompt .p3 { color: var(--green); }
.cursor { display: inline-block; width: 8px; height: 16px; background: var(--rosewater); vertical-align: -3px; animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.swatches { display: flex; margin-top: 10px; }
.swatches i { width: 22px; height: 14px; display: block; }

/* About This PC */
.about { width: 470px; }
.about-body { padding: 4px 28px 22px; display: flex; flex-direction: column; align-items: center; }
.about-logo { width: 110px; height: 110px; border-radius: 28px; display: grid; place-items: center; color: var(--blue);
  background: radial-gradient(circle at 50% 30%, rgba(137,180,250,.22), rgba(137,180,250,.04) 70%);
  border: 1px solid rgba(137,180,250,.18); margin-top: 6px; }
.about h1 { font-size: 26px; font-weight: 800; letter-spacing: -.03em; margin-top: 16px; }
.about .sub { color: var(--overlay1); margin-top: 2px; font-size: 12.5px; }
.ff-table { width: 100%; margin-top: 18px; display: grid; grid-template-columns: auto 1fr; column-gap: 14px; row-gap: 5px; font-size: 12.5px; }
.ff-table dt { text-align: right; color: var(--subtext0); font-weight: 600; white-space: nowrap; }
.ff-table dd { font-family: var(--mono); font-size: 12px; color: var(--text); }
.ff-table dd em { font-style: normal; color: var(--overlay1); }
.palette { display: flex; gap: 5px; margin-top: 16px; }
.palette i { width: 18px; height: 18px; border-radius: 5px; display: block; }
.btn { height: 28px; padding: 0 14px; border-radius: 8px; background: var(--surface0); border: 1px solid var(--hairline-2); font-weight: 600; color: var(--text); }
.btn:hover { background: var(--surface1); }
.btn.primary { background: var(--accent); color: var(--crust); border-color: transparent; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { background: var(--red); color: var(--crust); border-color: transparent; }
.about .actions { display: flex; gap: 8px; margin-top: 18px; }
.about .legal { margin-top: 14px; font-size: 11px; color: var(--overlay0); text-align: center; line-height: 1.5; }

/* System Settings */
.settings { width: 920px; height: 640px; flex-direction: row; }
.ss-side { width: 260px; background: rgba(17,17,27,.32); border-right: 1px solid var(--hairline); display: flex; flex-direction: column; flex: none; }
.ss-side .titlebar { padding: 0 16px; }
.ss-search { margin: 0 12px 10px; height: 30px; border-radius: 8px; background: var(--surface0); display: flex; align-items: center; gap: 7px; padding: 0 9px; color: var(--overlay1); border: 1px solid transparent; }
.ss-search:focus-within { border-color: var(--accent); }
.ss-search input { flex: 1; background: transparent; border: 0; outline: 0; font-size: 13px; min-width: 0; }
.ss-search input::placeholder { color: var(--overlay1); }
.ss-nav { flex: 1; overflow-y: auto; padding: 0 10px 14px; }
.ss-nav::-webkit-scrollbar, .ss-main::-webkit-scrollbar { width: 8px; }
.ss-nav::-webkit-scrollbar-thumb, .ss-main::-webkit-scrollbar-thumb { background: var(--surface0); border-radius: 8px; }
.ss-account { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 10px; margin-bottom: 10px; }
.ss-account:hover { background: rgba(205,214,244,.05); }
.ss-account .avatar { width: 42px; height: 42px; font-size: 15px; }
.ss-account b { display: block; font-size: 14px; font-weight: 600; }
.ss-account span { font-size: 11.5px; color: var(--overlay1); }
.ss-group { margin-bottom: 12px; }
.ss-item { display: flex; align-items: center; gap: 9px; height: 30px; padding: 0 8px; border-radius: 7px; color: var(--text); width: 100%; text-align: left; }
.ss-item:hover { background: rgba(205,214,244,.05); }
.ss-item.active { background: var(--accent); color: var(--crust); font-weight: 600; }
.ss-item.active .tile-ic { box-shadow: 0 0 0 1.5px rgba(17,17,27,.35); }
.tile-ic { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; color: var(--crust); flex: none; }
.tile-ic.lg { width: 30px; height: 30px; border-radius: 8px; }
.tile-ic.xl { width: 72px; height: 72px; border-radius: 18px; box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 8px 24px rgba(0,0,0,.3); }

.ss-main { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow-y: auto; position: relative; }
.ss-top { position: sticky; top: 0; z-index: 2; height: 52px; display: flex; align-items: center; gap: 4px; padding: 0 20px; background: rgba(30,30,46,.55); backdrop-filter: blur(16px); }
.ss-top .nav-btn { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; color: var(--subtext0); }
.ss-top .nav-btn:hover:not([disabled]) { background: var(--surface0); }
.ss-top .nav-btn[disabled] { color: var(--surface2); }
.ss-top .crumb { margin-left: 8px; font-weight: 700; font-size: 14px; }
.ss-content { padding: 0 28px 30px; display: flex; flex-direction: column; gap: 14px; }
.hero { border: 1px solid var(--hairline-2); background: rgba(49,50,68,.35); border-radius: 14px; padding: 26px 32px 22px; display: flex; flex-direction: column; align-items: center; text-align: center; }
.hero h2 { font-size: 24px; font-weight: 800; letter-spacing: -.02em; margin-top: 12px; }
.hero p { color: var(--subtext0); margin-top: 6px; line-height: 1.5; max-width: 480px; }
.group { border: 1px solid var(--hairline-2); background: rgba(49,50,68,.35); border-radius: 12px; overflow: hidden; }
.group-title { font-size: 12px; font-weight: 700; color: var(--subtext0); margin: 6px 4px -6px; }
.row { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 8px 14px; position: relative; }
.row + .row::before { content: ""; position: absolute; top: 0; left: 56px; right: 14px; height: 1px; background: var(--hairline-2); }
.row.noicon + .row::before, .row.noicon::before { left: 14px; }
.row.link:hover { background: rgba(205,214,244,.04); }
.row .r-txt { display: flex; flex-direction: column; min-width: 0; }
.row .r-l { font-size: 13.5px; font-weight: 500; }
.row .r-s { font-size: 11.5px; color: var(--overlay1); margin-top: 1px; }
.row .r-r { margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--overlay1); font-size: 12.5px; }
.row .r-r .chev { color: var(--overlay0); }
.row .r-r .val { font-family: var(--mono); font-size: 12px; }
.row .r-r .badge { background: var(--accent); color: var(--crust); font-weight: 700; font-size: 11px; padding: 2px 7px; border-radius: 99px; }
.row .r-r .ok { color: var(--green); }
.row input[type=range] { width: 220px; flex: none; }
.select { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px 0 10px; border-radius: 7px; background: var(--surface0); color: var(--text); font-size: 12.5px; border: 1px solid var(--hairline-2); }
.select .ic { color: var(--overlay1); }

.flavors { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 16px; }
.flavor { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12px; color: var(--subtext0); }
.flavor .prev { width: 100%; aspect-ratio: 16/10; border-radius: 9px; border: 2px solid transparent; position: relative; overflow: hidden; }
.flavor .prev i { position: absolute; left: 8%; right: 8%; top: 10%; height: 10%; border-radius: 3px; }
.flavor .prev b { position: absolute; left: 8%; width: 45%; top: 28%; bottom: 12%; border-radius: 4px; }
.flavor.sel .prev { border-color: var(--accent); }
.flavor.sel { color: var(--text); font-weight: 600; }
.accents { display: flex; gap: 9px; }
.accents button { width: 20px; height: 20px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.2); }
.accents button.sel { box-shadow: 0 0 0 2px var(--base), 0 0 0 4px currentColor; }
.walls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 16px; }
.wall { aspect-ratio: 16/10; border-radius: 10px; border: 2px solid transparent; position: relative; overflow: hidden; }
.wall.sel { border-color: var(--accent); }
.wall span { position: absolute; left: 8px; bottom: 6px; font-size: 11px; font-weight: 600; color: var(--subtext1); }
.monitor-art { display: flex; flex-direction: column; align-items: center; padding: 22px 0 16px; }
.monitor-art .scr { width: 220px; height: 124px; border-radius: 8px; border: 6px solid var(--crust); background: radial-gradient(circle at 70% 120%, color-mix(in srgb, var(--accent) 40%, transparent), transparent 60%), #151521; box-shadow: 0 10px 24px rgba(0,0,0,.4); position: relative; }
.monitor-art .scr::before { content: ""; position: absolute; top: 5px; left: 6px; right: 6px; height: 6px; border-radius: 3px; background: rgba(205,214,244,.15); }
.monitor-art .stand { width: 40px; height: 18px; background: var(--surface1); clip-path: polygon(30% 0, 70% 0, 85% 100%, 15% 100%); }
.monitor-art b { margin-top: 10px; font-size: 13px; }
.monitor-art span { font-size: 11.5px; color: var(--overlay1); font-family: var(--mono); }
.seg { display: inline-flex; background: var(--surface0); border-radius: 8px; padding: 2px; }
.seg button { padding: 4px 10px; border-radius: 6px; font-size: 12px; color: var(--subtext0); }
.seg button.sel { background: var(--surface2); color: var(--text); font-weight: 600; }

/* Force quit */
.fq { width: 380px; }
.fq-body { padding: 0 18px 18px; }
.fq-list { border: 1px solid var(--hairline-2); border-radius: 10px; overflow: hidden; margin: 8px 0 14px; }
.fq-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; }
.fq-item.sel { background: var(--accent); color: var(--crust); }
.fq-item .tile-ic { width: 24px; height: 24px; }
.fq-item .mem { margin-left: auto; font: 500 11px var(--mono); color: var(--overlay1); }
.fq-item.sel .mem { color: var(--crust); }

/* ============================================================
   Overlays: dialogs, lock screen, sleep
   ============================================================ */
#overlay { position: fixed; inset: 0; z-index: 200; pointer-events: none; }
#overlay > * { pointer-events: auto; }
.dim { position: absolute; inset: 0; background: rgba(17,17,27,.55); backdrop-filter: blur(6px); display: grid; place-items: center; animation: fade .2s; }
@keyframes fade { from { opacity: 0; } }
.dialog { width: 300px; padding: 22px 20px 16px; border-radius: 16px; background: var(--glass-strong); border: 1px solid var(--hairline-2); box-shadow: var(--shadow); text-align: center; animation: pop .18s; }
.dialog .d-ic { width: 54px; height: 54px; border-radius: 14px; margin: 0 auto 12px; display: grid; place-items: center; background: var(--surface0); color: var(--accent); }
.dialog h4 { font-size: 14px; font-weight: 700; line-height: 1.35; }
.dialog p { font-size: 12px; color: var(--overlay2); margin-top: 6px; line-height: 1.45; }
.dialog .d-acts { display: flex; gap: 8px; margin-top: 16px; }
.dialog .d-acts .btn { flex: 1; }
.lockscreen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; animation: fade .35s; }
.lockscreen .lk-bg { position: absolute; inset: 0; background: inherit; }
.lockscreen .lk-blur { position: absolute; inset: 0; backdrop-filter: blur(30px) brightness(.7); background: rgba(17,17,27,.35); }
.lockscreen .lk-inner { position: relative; display: flex; flex-direction: column; align-items: center; margin-top: 12vh; }
.lk-date { font-size: 18px; font-weight: 600; color: var(--subtext1); }
.lk-time { font: 700 112px/1 var(--mono); letter-spacing: -.04em; color: var(--text); margin-top: 6px; }
.lk-user { position: relative; margin-top: auto; margin-bottom: 14vh; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.lk-user .avatar { width: 64px; height: 64px; font-size: 22px; }
.lk-user b { font-size: 15px; }
.lk-pass { width: 220px; height: 34px; border-radius: 99px; background: rgba(49,50,68,.7); border: 1px solid var(--hairline-2); display: flex; align-items: center; padding: 0 6px 0 14px; }
.lk-pass input { flex: 1; background: transparent; border: 0; outline: 0; font-size: 13px; }
.lk-pass input::placeholder { color: var(--overlay1); }
.lk-pass button { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--crust); }
.lk-hint { font-size: 11.5px; color: var(--overlay1); }
.sleep { position: absolute; inset: 0; background: #000; animation: fade .6s; display: grid; place-items: center; color: #222; font-size: 12px; }

/* ============================================================
   Date & time panel (clock + weather + calendar)
   ============================================================ */
.dt { width: 680px; padding: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.dt-col { display: flex; flex-direction: column; min-width: 0; }
.dt-clock { padding: 14px 16px; border-radius: 14px; background: rgba(49,50,68,.35); border: 1px solid var(--hairline); }
.dt-greet { font-size: 13px; font-weight: 600; color: var(--accent); }
.dt-time { font-size: 64px; font-weight: 700; line-height: 1; letter-spacing: -.03em; margin-top: 4px;
  background: linear-gradient(180deg, var(--text), var(--lavender)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.dt-time small { font-size: 26px; letter-spacing: 0; color: var(--overlay1); -webkit-text-fill-color: var(--overlay1); margin-left: 2px; }
.dt-date { font-size: 14px; font-weight: 600; color: var(--subtext1); margin-top: 6px; }
.dt-zones { display: flex; gap: 12px; margin-top: 10px; font-size: 11px; color: var(--overlay1); }
.dt-zones b { color: var(--subtext1); font-weight: 600; }
.dt-weather { margin-top: 10px; padding: 12px 14px; border-radius: 14px; background: rgba(49,50,68,.35); border: 1px solid var(--hairline); }
.dt-weather .ww-top { margin-top: 0; }
.dt-weather .ww-temp { font-size: 44px; }
.dt-weather .ww-hours div { padding: 6px 0; }
.dt .cal-grid { font-size: 12px; }
.dt .cal-grid .d { padding: 5px 0; }
.dt .event { margin-top: 5px; padding: 7px 10px; }

/* Weather */
.ww-top { display: flex; align-items: flex-start; margin-top: 10px; }
.ww-loc { display: flex; align-items: center; gap: 5px; color: var(--subtext0); font-weight: 600; }
.ww-temp { font-size: 58px; font-weight: 700; line-height: 1; margin-top: 4px; letter-spacing: -.03em; }
.ww-cond { color: var(--subtext1); font-weight: 600; margin-top: 2px; }
.ww-ic { margin-left: auto; color: var(--yellow); filter: drop-shadow(0 6px 18px rgba(249,226,175,.25)); }
.ww-meta { display: flex; gap: 14px; margin-top: 10px; font-size: 12px; color: var(--overlay2); font-weight: 600; }
.ww-meta span { display: inline-flex; align-items: center; gap: 4px; }
.ww-hours { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 12px; }
.ww-hours div { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 0; border-radius: 12px; background: rgba(49,50,68,.35); font-size: 11.5px; color: var(--overlay2); font-weight: 600; }
.ww-hours div.now { background: var(--accent-soft); color: var(--text); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent); }
.ww-hours b { color: var(--text); font-family: var(--mono); font-size: 12px; }

/* ============================================================
   Mock app windows (workspaces 3–10)
   ============================================================ */
.app-body { flex: 1; display: flex; min-height: 0; }
.side { width: 210px; flex: none; background: rgba(17,17,27,.28); border-right: 1px solid var(--hairline); padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; font-size: 12.5px; }
.side .s-h { font-size: 10.5px; font-weight: 700; color: var(--overlay1); text-transform: uppercase; letter-spacing: .08em; margin: 10px 8px 4px; }
.side .s-i { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; color: var(--subtext0); }
.side .s-i.on { background: var(--accent-soft); color: var(--text); }
.side .s-i .ic { color: var(--overlay2); }
.main { flex: 1; min-width: 0; padding: 18px 22px; overflow: hidden; }
.code { font: 12.5px/1.65 var(--mono); }
.code .ln { color: var(--surface2); display: inline-block; width: 34px; text-align: right; margin-right: 16px; }
.k1 { color: var(--mauve); } .k2 { color: var(--blue); } .k3 { color: var(--green); } .k4 { color: var(--peach); } .k5 { color: var(--overlay1); font-style: italic; } .k6 { color: var(--yellow); } .k7 { color: var(--teal); }
.tabs { display: flex; gap: 2px; padding: 6px 10px 0; background: rgba(17,17,27,.30); }
.tab { padding: 7px 14px; border-radius: 9px 9px 0 0; font-size: 12px; color: var(--overlay2); display: flex; align-items: center; gap: 7px; }
.tab.on { background: rgba(30,30,46,.7); color: var(--text); }
.urlbar { display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: rgba(30,30,46,.7); border-bottom: 1px solid var(--hairline); color: var(--overlay2); }
.urlbar .u { flex: 1; height: 30px; border-radius: 9px; background: rgba(17,17,27,.45); display: flex; align-items: center; gap: 8px; padding: 0 12px; font-size: 12.5px; color: var(--subtext1); }
.page h1 { font-size: 30px; font-weight: 700; letter-spacing: -.02em; }
.page p { color: var(--subtext0); line-height: 1.65; margin-top: 10px; max-width: 760px; }
.page .note { margin-top: 16px; padding: 12px 14px; border-radius: 12px; background: rgba(137,180,250,.08); border-left: 3px solid var(--blue); color: var(--subtext1); }
.page pre { margin-top: 14px; padding: 12px 14px; border-radius: 10px; background: rgba(17,17,27,.5); font: 12.5px/1.6 var(--mono); color: var(--green); }
.msg { display: flex; gap: 12px; margin-bottom: 16px; }
.msg .av { width: 36px; height: 36px; border-radius: 50%; flex: none; }
.msg b { font-weight: 700; } .msg time { font-size: 11px; color: var(--overlay1); margin-left: 6px; }
.msg p { color: var(--subtext1); margin-top: 3px; line-height: 1.5; }
.grid-files { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 14px; margin-top: 14px; }
.gf { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 6px; border-radius: 12px; font-size: 12px; color: var(--subtext1); }
.gf:hover { background: rgba(205,214,244,.05); }
.gf .ic { color: var(--blue); }
.games { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 14px; }
.game { aspect-ratio: 3/4; border-radius: 12px; position: relative; overflow: hidden; display: flex; align-items: flex-end; padding: 10px; font-weight: 700; box-shadow: inset 0 -60px 50px -20px rgba(17,17,27,.8); }
.track { display: grid; grid-template-columns: 26px 1fr 140px 50px; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 9px; font-size: 12.5px; color: var(--subtext0); }
.track.on { background: var(--accent-soft); color: var(--text); }
.track .n { font-family: var(--mono); color: var(--overlay1); }
.bt-box { border: 1px solid var(--surface1); border-radius: 10px; padding: 10px 12px; position: relative; margin-top: 12px; }
.bt-box > i { position: absolute; top: -9px; left: 12px; padding: 0 6px; font-style: normal; background: rgba(30,30,46,1); color: var(--accent); font-size: 12px; }
.bt-bar { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
.bt-bar span:first-child { width: 46px; color: var(--overlay2); }
.bt-bar .blk { flex: 1; letter-spacing: -1px; white-space: nowrap; overflow: hidden; }

/* Bar extras: notification badge, power mode */
.icon-btn { position: relative; }
.icon-btn .badge { position: absolute; top: 3px; right: 4px; min-width: 14px; height: 14px; padding: 0 3px; border-radius: 99px; background: var(--red); color: var(--crust); font: 700 9px/14px var(--mono); text-align: center; box-shadow: 0 0 0 2px rgba(17,17,27,.6); }
.icon-btn.p-saver { color: var(--green); } .icon-btn.p-perf { color: var(--peach); }
.vol-pct { font: 600 11px var(--mono); color: var(--subtext1); margin-left: -2px; }
.opts { display: flex; flex-direction: column; gap: 6px; }
.opt { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; background: rgba(49,50,68,.35); border: 1px solid transparent; text-align: left; width: 100%; }
.opt:hover { background: rgba(49,50,68,.6); }
.opt .o-ic { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: var(--surface1); color: var(--subtext1); flex: none; }
.opt b { display: block; font-weight: 700; } .opt span { font-size: 11.5px; color: var(--overlay1); }
.opt .radio { margin-left: auto; width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--surface2); flex: none; }
.opt.sel { border-color: color-mix(in srgb, var(--oc, var(--accent)) 45%, transparent); background: color-mix(in srgb, var(--oc, var(--accent)) 12%, transparent); }
.opt.sel .o-ic { background: var(--oc, var(--accent)); color: var(--crust); }
.opt.sel .radio { border-color: var(--oc, var(--accent)); box-shadow: inset 0 0 0 3px var(--base), inset 0 0 0 9px var(--oc, var(--accent)); }
.notif { display: flex; gap: 11px; padding: 11px 12px; border-radius: 13px; background: rgba(49,50,68,.40); border: 1px solid var(--hairline); margin-bottom: 7px; }
.notif .n-ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: var(--crust); flex: none; }
.notif .n-t { display: flex; align-items: baseline; gap: 8px; } .notif .n-t b { font-weight: 700; }
.notif .n-t time { margin-left: auto; font-size: 11px; color: var(--overlay1); white-space: nowrap; }
.notif p { font-size: 12px; color: var(--subtext0); margin-top: 2px; line-height: 1.45; }
.notif .n-app { font-size: 10.5px; color: var(--overlay1); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
.empty-note { text-align: center; color: var(--overlay1); padding: 26px 0; }
.empty-note .ic { margin: 0 auto 8px; color: var(--surface2); }
.code > div { white-space: pre; }

/* Maximized (full size) windows: fill everything under the bar, no margin */
.win { transition: opacity .32s ease, transform .4s cubic-bezier(.2,.8,.2,1), visibility 0s,
  left .3s cubic-bezier(.2,.8,.2,1), top .3s cubic-bezier(.2,.8,.2,1), width .3s cubic-bezier(.2,.8,.2,1), height .3s cubic-bezier(.2,.8,.2,1), border-radius .3s; }
.win.dragging { transition: none; }
.win.max { left: 0 !important; top: var(--bar-h) !important; width: 100vw !important; height: calc(100vh - var(--bar-h)) !important;
  border-radius: 0; border-width: 0; box-shadow: none; }
.win.max.focused { box-shadow: none; }
.win.max .titlebar { cursor: default; }
.settings.max .ss-content { max-width: 900px; width: 100%; margin: 0 auto; }

</style>
</head>

const WS_COUNT = 10;

/* ---------- Workspaces ---------- */
function wsWins(n) { return Object.values(wins).filter(w => +w.dataset.ws === n); }

function renderWorkspaces() {
  $('#workspaces').innerHTML = Array.from({ length: WS_COUNT }, (_, i) => i + 1).map(n => {
    const apps = wsWins(n).map(w => w.dataset.app);
    return `<button class="ws ${apps.length ? 'occupied' : ''} ${n === S.ws ? 'active' : ''}" data-ws="${n}" title="${apps.join(', ') || 'Empty'}">${n}</button>`;
  }).join('');
  const cur = wsWins(S.ws);
  const f = cur.find(w => w.classList.contains('focused')) || cur[cur.length - 1];
  $('#appName').textContent = f ? f.dataset.app : 'Desktop';
}

// niri workspaces are stacked vertically: windows slide up/down
function syncWorkspace() {
  Object.values(wins).forEach(w => {
    const n = +w.dataset.ws;
    w.classList.toggle('ws-off', n !== S.ws);
    w.style.setProperty('--ws-y', n < S.ws ? '-90px' : '90px');
  });
  // bar goes edge-to-edge while a full-size app is on screen, floating with margins otherwise
  document.body.classList.toggle('bar-flush', wsWins(S.ws).some(w => w.classList.contains('max')));
  renderWorkspaces();
}

function switchWorkspace(n) {
  n = clamp(n, 1, WS_COUNT);
  if (n === S.ws) return;
  S.ws = n;
  const cur = wsWins(n);
  if (cur.length) focusWin(cur[cur.length - 1]);
  syncWorkspace();
}

/* ---------- Calendar grid ---------- */
function calGridHTML() {
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  const first = new Date(y, m, 1).getDay();
  const days = new Date(y, m + 1, 0).getDate();
  const prevDays = new Date(y, m, 0).getDate();
  const cells = [];
  for (let i = first - 1; i >= 0; i--) cells.push(`<span class="d mute">${prevDays - i}</span>`);
  for (let d = 1; d <= days; d++) {
    const dow = (first + d - 1) % 7;
    cells.push(`<span class="d ${d === now.getDate() ? 'today' : ''} ${dow === 0 || dow === 6 ? 'we' : ''}">${d}</span>`);
  }
  while (cells.length % 7) cells.push(`<span class="d mute">${cells.length - days - first + 1}</span>`);
  return `<div class="cal-grid">${['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'].map(d => `<span class="dow">${d}</span>`).join('')}${cells.join('')}</div>`;
}

function fmtDate(d) { return `${DAYS[d.getDay()]}, ${MONTHS[d.getMonth()]} ${pad(d.getDate())}, ${d.getFullYear()}`; }

/* ============================================================
   Panel system
   ============================================================ */
let openName = null;
let openAnchor = null;

function closePanel() {
  $('#panelLayer').innerHTML = '';
  if (openAnchor) openAnchor.classList.remove('active');
  openName = null; openAnchor = null;
}

function openPanel(name, anchor) {
  if (openName === name) return closePanel();
  closePanel();
  const builder = name.startsWith('menu:') ? () => buildMenu(APP_MENUS[name.slice(5)]) : PANELS[name];
  const el = h(builder());
  $('#panelLayer').appendChild(el);
  openName = name; openAnchor = anchor;
  anchor.classList.add('active');
  positionPanel(el, anchor);
  bindPanel(el);
}

function positionPanel(el, anchor) {
  const r = anchor.getBoundingClientRect();
  const w = el.offsetWidth;
  const isRight = r.left > window.innerWidth / 2;
  let left = isRight ? r.right - w : r.left;
  left = clamp(left, 10, window.innerWidth - w - 10);
  el.style.left = left + 'px';
}

function refreshPanel() {
  if (!openName) return;
  const old = $('#panelLayer').firstElementChild;
  if (!old) return;
  const name = openName;
  const builder = name.startsWith('menu:') ? () => buildMenu(APP_MENUS[name.slice(5)]) : PANELS[name];
  const el = h(builder());
  el.style.left = old.style.left;
  el.style.animation = 'none';
  old.replaceWith(el);
  bindPanel(el);
}

/* ---------- macOS-style menus ---------- */
function buildMenu(items, extraClass = '') {
  return `<div class="panel menu ${extraClass}">${items.map(it => {
    if (it === '-') return '<div class="menu-sep"></div>';
    if (it.head) return `<div class="menu-head">${it.head}</div>`;
    return `<div class="menu-item ${it.disabled ? 'disabled' : ''}" ${it.act ? `data-act="${it.act}"` : ''} ${it.sub ? `data-sub="${it.sub}"` : ''}>
      ${it.icon ? `<span class="mi-icon">${icon(it.icon, 14)}</span>` : ''}
      <span>${it.label}</span>
      ${it.kbd ? `<span class="kbd">${it.kbd}</span>` : ''}
      ${it.sub ? `<span class="sub">${icon('chevR', 13)}</span>` : ''}
    </div>`;
  }).join('')}</div>`;
}

function sparkPath(arr, w = 400, hgt = 54) {
  const max = 100, step = w / (arr.length - 1);
  const pts = arr.map((v, i) => `${(i * step).toFixed(1)},${(hgt - (v / max) * hgt * 0.95).toFixed(1)}`);
  return { line: pts.join(' '), area: `0,${hgt} ${pts.join(' ')} ${w},${hgt}` };
}

/* ---------- Panel interactions ---------- */
function bindPanel(el) {
  // Submenu (Recent Items)
  $$('[data-sub]', el).forEach(item => {
    let sub;
    item.addEventListener('mouseenter', () => {
      $$('.submenu', el).forEach(s => s.remove());
      $$('.menu-item.open', el).forEach(i => i.classList.remove('open'));
      sub = h(buildMenu(RECENT_MENU, 'submenu'));
      sub.style.animation = 'none';
      item.classList.add('open');
      item.appendChild(sub);
    });
  });
  $$('.menu-item:not([data-sub])', el).forEach(item => {
    if (item.closest('.submenu')) return;
    item.addEventListener('mouseenter', () => {
      $$('.submenu', el).forEach(s => s.remove());
      $$('.menu-item.open', el).forEach(i => i.classList.remove('open'));
    });
  });
}

document.addEventListener('click', (e) => {
  const trig = e.target.closest('[data-panel]');
  if (trig) { e.stopPropagation(); openPanel(trig.dataset.panel, trig); return; }

  const wsBtn = e.target.closest('[data-ws]');
  if (wsBtn) { switchWorkspace(+wsBtn.dataset.ws); closePanel(); return; }

  const tog = e.target.closest('[data-toggle]');
  if (tog) {
    const k = tog.dataset.toggle; S[k] = !S[k];
    renderBar(); refreshPanel(); refreshSettings();
    return;
  }

  const act = e.target.closest('[data-act]');
  if (act) { runAction(act.dataset.act); return; }

  const menuItem = e.target.closest('.menu-item');
  if (menuItem && !menuItem.dataset.sub) { closePanel(); return; }

  if (!e.target.closest('.panel')) closePanel();
});

// macOS behaviour: once a menu is open, hovering a sibling menu title switches to it
document.addEventListener('mouseover', (e) => {
  const trig = e.target.closest('#bar [data-panel]');
  if (!trig || !openName || trig === openAnchor) return;
  const isMenu = (n) => n === 'arch' || n.startsWith('menu:');
  if (isMenu(openName) && isMenu(trig.dataset.panel)) { closePanel(); openPanel(trig.dataset.panel, trig); }
});

document.addEventListener('input', (e) => {
  const r = e.target.closest('[data-range]');
  if (!r) return;
  const k = r.dataset.range; S[k] = +r.value;
  const min = +r.min, max = +r.max;
  // keep every slider bound to the same key in sync
  $$(`[data-range="${k}"]`).forEach(x => {
    if (x !== r) x.value = S[k];
    x.style.setProperty('--p', ((S[k] - min) / (max - min) * 100) + '%');
    const v = x.parentElement.querySelector('.val');
    if (v) v.textContent = S[k] + (k === 'nightTemp' ? 'K' : '%');
  });
  if (k === 'bri') $('#briBtn').innerHTML = icon(S.bri < 40 ? 'sunDim' : 'sun', 15);
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closePanel(); const d = $('#overlay .dim'); if (d) d.remove(); }
  // Alt+1..9, Alt+0 = workspace 10, Alt+Up/Down like niri's focus-workspace-up/down
  if (e.altKey && /^[0-9]$/.test(e.key)) { e.preventDefault(); switchWorkspace(e.key === '0' ? 10 : +e.key); }
  if (e.altKey && e.key === 'ArrowUp') switchWorkspace(S.ws - 1);
  if (e.altKey && e.key === 'ArrowDown') switchWorkspace(S.ws + 1);
});

document.addEventListener('wheel', (e) => {
  if (!e.target.closest('#workspaces')) return;
  switchWorkspace(S.ws + (e.deltaY > 0 ? 1 : -1));
});

function runAction(a) {
  const keepOpen = ['play', 'profile', 'noop', 'mute', 'clearnotifs'];
  if (!keepOpen.includes(a) && !/^(setprofile|dismiss):/.test(a)) closePanel();
  if (a.startsWith('setprofile:')) { S.profile = a.slice(11); renderBar(); refreshPanel(); refreshSettings(); return; }
  if (a.startsWith('dismiss:')) { S.notifs.splice(+a.slice(8), 1); renderBar(); return refreshPanel(); }
  if (a === 'clearnotifs') { S.notifs = []; renderBar(); return refreshPanel(); }
  if (a === 'mute') { S.muted = !S.muted; renderBar(); return refreshPanel(); }
  if (a === 'about') return openWindow('about');
  if (a === 'settings') return openSettings('general');
  if (a.startsWith('settings:')) return openSettings(a.split(':')[1]);
  if (a === 'forcequit') return openWindow('forcequit');
  if (a === 'lock') return showLock();
  if (a === 'sleep') return showSleep();
  if (a === 'restart') return showDialog('restart');
  if (a === 'shutdown') return showDialog('shutdown');
  if (a === 'logout') return showDialog('logout');
  if (a === 'play') { S.playing = !S.playing; return refreshPanel(); }
  if (a === 'profile') {
    const p = ['Power Saver', 'Balanced', 'Performance'];
    S.profile = p[(p.indexOf(S.profile) + 1) % 3]; renderBar(); refreshPanel(); refreshSettings(); return;
  }
}

   ============================================================ */
let zTop = 20;
const wins = {};

function focusWin(el) {
  $$('.win').forEach(w => w.classList.remove('focused'));
  el.classList.add('focused');
  el.style.zIndex = ++zTop;
  if (+el.dataset.ws === S.ws) renderWorkspaces();
}

const APP_NAMES = { about: 'About This PC', forcequit: 'Force Quit', settings: 'System Settings' };

function makeWindow(id, html, { x, y, ws = S.ws, app, max = false } = {}) {
  if (wins[id]) {
    if (+wins[id].dataset.ws !== S.ws) switchWorkspace(+wins[id].dataset.ws);
    focusWin(wins[id]); return wins[id];
  }
  const el = h(html);
  el.dataset.win = id;
  el.dataset.ws = ws;
  el.dataset.app = app || APP_NAMES[id] || id;
  $('#desktop').appendChild(el);
  const W = el.offsetWidth, H = el.offsetHeight;
  el.style.left = (x ?? Math.round((window.innerWidth - W) / 2)) + 'px';
  el.style.top = (y ?? Math.max(60, Math.round((window.innerHeight - H) / 2) + 10)) + 'px';
  el.classList.toggle('max', max);
  wins[id] = el;
  focusWin(el);
  el.addEventListener('pointerdown', () => focusWin(el));
  $$('.l-close', el).forEach(b => b.addEventListener('click', (e) => { e.stopPropagation(); closeWin(id); }));
  $$('.l-max', el).forEach(b => b.addEventListener('click', (e) => { e.stopPropagation(); toggleMax(el); }));
  $$('[data-drag]', el).forEach(bar => {
    enableDrag(el, bar);
    bar.addEventListener('dblclick', (e) => { if (!e.target.closest('button, input')) toggleMax(el); });
  });
  syncWorkspace();
  return el;
}

function closeWin(id) {
  const el = wins[id]; if (!el) return;
  el.classList.add('closing');
  setTimeout(() => el.remove(), 160);
  delete wins[id];
  syncWorkspace();
}

// Full size (maximized) <-> floating. Floating geometry stays in the inline style,
// .max overrides it, so restoring just drops the class.
function toggleMax(el) {
  el.classList.toggle('max');
  syncWorkspace();
}

function enableDrag(el, handle) {
  handle.addEventListener('pointerdown', (e) => {
    if (e.target.closest('button, input, .lights') || el.classList.contains('max')) return;
    el.classList.add('dragging');
    const sx = e.clientX, sy = e.clientY, ox = el.offsetLeft, oy = el.offsetTop;
    const move = (ev) => {
      el.style.left = (ox + ev.clientX - sx) + 'px';
      el.style.top = Math.max(52, oy + ev.clientY - sy) + 'px';
    };
    const up = () => { el.classList.remove('dragging'); removeEventListener('pointermove', move); removeEventListener('pointerup', up); };
    addEventListener('pointermove', move); addEventListener('pointerup', up);
  });
}

const SUBPAGES = {
  about: { title: 'About', render: () => `
    <div class="hero"><div class="about-logo" style="width:84px;height:84px;border-radius:22px">${icon('arch', 48)}</div><h2>Arch Linux</h2><p class="mono" style="font-size:12px">${USER.login}@archlinux · rolling</p></div>
    <div class="group">${FASTFETCH.map(([k, v]) => rowHTML({ label: k, value: v, kind: 'value' }, true)).join('')}</div>` },
};

let ssPane = 'general', ssSub = null, ssHist = [], ssFwd = [];

function rowHTML(r, noicon = false) {
  const ic = r.ic ? tileIc(r.ic, r.color, 'lg', 16) : '';
  let right = '';
  if (r.kind === 'toggle') right = `<span class="switch ${S[r.key] ? 'on' : ''}" data-toggle="${r.key}"></span>`;
  else if (r.kind === 'nav') right = `${r.value ? `<span>${r.value}</span>` : ''}<span class="chev">${icon('chevR', 14)}</span>`;
  else if (r.kind === 'value') right = `<span class="val">${r.value}</span>`;
  else if (r.kind === 'select') right = `<span class="select">${r.label === 'Power Mode' ? S.profile : r.value}${icon('chevD', 12)}</span>`;
  else if (r.kind === 'range') right = `<input type="range" min="0" max="100" value="${S[r.key]}" data-range="${r.key}" style="--p:${S[r.key]}%"><span class="val" style="width:36px;text-align:right">${S[r.key]}%</span>`;
  const cls = ['row', r.kind === 'nav' ? 'link' : '', !r.ic ? 'noicon' : ''].join(' ');
  return `<div class="${cls}" ${r.to ? `data-sub-page="${r.to}"` : ''} ${r.label === 'Power Mode' ? 'data-act="profile"' : ''}>${ic}<div class="r-txt"><span class="r-l">${r.label}</span>${r.sub ? `<span class="r-s">${r.sub}</span>` : ''}</div><div class="r-r">${right}</div></div>`;
}

function customPane(kind) {
  if (kind === 'appearance') {
    const flavors = [['Latte', '#eff1f5', '#dce0e8', '#ccd0da'], ['Frappé', '#303446', '#232634', '#414559'], ['Macchiato', '#24273a', '#181926', '#363a4f'], ['Mocha', '#1e1e2e', '#11111b', '#313244']];
    const accents = ['rosewater', 'flamingo', 'pink', 'mauve', 'red', 'maroon', 'peach', 'yellow', 'green', 'teal', 'sky', 'sapphire', 'blue', 'lavender'];
    return `
      <div class="group"><div class="flavors">${flavors.map(f => `<button class="flavor ${f[0] === 'Mocha' ? 'sel' : ''}"><span class="prev" style="background:${f[1]}"><i style="background:${f[3]}"></i><b style="background:${f[2]}"></b></span>${f[0]}</button>`).join('')}</div></div>
      <div class="group">
        <div class="row noicon"><div class="r-txt"><span class="r-l">Accent colour</span><span class="r-s">${S.accent[0].toUpperCase() + S.accent.slice(1)}</span></div><div class="r-r"><div class="accents">${accents.map(a => `<button style="background:${PALETTE[a]};color:${PALETTE[a]}" class="${a === S.accent ? 'sel' : ''}" data-accent="${a}" title="${a}"></button>`).join('')}</div></div></div>
        ${rowHTML(R.tog('', '', 'Reduce transparency', 'reduceTrans'))}
        ${rowHTML(R.tog('', '', 'Show scroll bars', 'scroll'))}
      </div>
      <div class="group">
        ${rowHTML(R.sel('type', 'mauve', 'Interface font', 'Inter 11'))}
        ${rowHTML(R.sel('terminal', 'lavender', 'Monospace font', 'JetBrainsMono Nerd Font 12'))}
        ${rowHTML(R.sel('layers', 'blue', 'Icon theme', 'Papirus-Dark (mocha)'))}
        ${rowHTML(R.sel('mouse', 'overlay', 'Cursor', 'catppuccin-mocha-dark'))}
      </div>`;
  }
  if (kind === 'displays') {
    return `
      <div class="group"><div class="monitor-art"><div class="scr"></div><div class="stand"></div><b>ASUS VG249QE5A</b><span>24" · 1920×1080 · DP-1</span></div></div>
      <div class="group">
        ${rowHTML(R.sel('monitor', 'sky', 'Resolution', '1920 × 1080'))}
        <div class="row"><span class="tile-ic lg" style="background:${PALETTE.sky}">${icon('zap', 16)}</span><div class="r-txt"><span class="r-l">Refresh rate</span></div><div class="r-r"><div class="seg"><button>60 Hz</button><button>120 Hz</button><button class="sel">144 Hz</button></div></div></div>
        ${rowHTML(R.sel('scan', 'overlay', 'Scale', '100%'))}
        ${rowHTML(R.tog('gauge', 'green', 'Variable refresh rate', 'vrr', 'G-SYNC Compatible'))}
      </div>
      <div class="group">
        ${rowHTML(R.rng('sun', 'yellow', 'Brightness', 'bri'))}
        ${rowHTML(R.tog('moon', 'peach', 'Night Light', 'night', 'wlsunset · ' + S.nightTemp + 'K'))}
      </div>`;
  }
  if (kind === 'wallpaper') {
    const walls = [['unix', 'UNIX Cloud', '#11111b url(wallpaper.jpg) center / cover'], ['mocha', 'Mocha Glow', 'radial-gradient(circle at 78% 115%, rgba(203,166,247,.35), transparent 60%), #151521'], ['plain', 'Crust', '#11111b'], ['dusk', 'Dusk', 'radial-gradient(circle at 50% 120%, rgba(250,179,135,.35), transparent 60%), #1b1726'], ['ocean', 'Sapphire', 'radial-gradient(circle at 20% 110%, rgba(116,199,236,.35), transparent 60%), #121826'], ['forest', 'Forest', 'radial-gradient(circle at 80% 0%, rgba(166,227,161,.25), transparent 60%), #121a17'], ['rose', 'Rose', 'radial-gradient(circle at 50% -20%, rgba(245,194,231,.3), transparent 60%), #1c1520']];
    return `<div class="group"><div class="walls">${walls.map(w => `<button class="wall ${S.wall === w[0] ? 'sel' : ''}" data-wall="${w[0]}" style="background:${w[2]}"><span>${w[1]}</span></button>`).join('')}</div></div>
      <div class="group">${rowHTML(R.sel('image', 'teal', 'Fit', 'Fill'))}${rowHTML(R.sel('sparkle', 'mauve', 'Transition', 'grow · 0.8s'))}</div>`;
  }
}

function settingsBody() {
  const meta = NAV_FLAT[ssPane];
  const pane = PANES[ssPane];
  if (ssSub) {
    const sp = SUBPAGES[ssSub];
    return { crumb: sp.title, html: sp.render() };
  }
  const hero = `<div class="hero">${tileIc(meta.ic, meta.color, 'xl', 38)}<h2>${meta.label}</h2>${pane.desc ? `<p>${pane.desc}</p>` : ''}</div>`;
  const groups = pane.custom ? customPane(pane.custom) : pane.groups.map(g => {
    const rows = Array.isArray(g) ? g : g.rows;
    return `${g.title ? `<div class="group-title">${g.title}</div>` : ''}<div class="group">${rows.map(r => rowHTML(r)).join('')}</div>`;
  }).join('');
  return { crumb: meta.label, html: hero + groups };
}

function renderSettings(el) {
  const filter = ($('.ss-search input', el)?.value || '').toLowerCase();
  $('.ss-nav', el).innerHTML = `
    <div class="ss-account"><div class="avatar">${USER.initials}</div><div><b>${USER.name}</b><span>Local Account · wheel</span></div></div>
    ${NAV.map(g => {
      const items = g.filter(([, label]) => label.toLowerCase().includes(filter));
      if (!items.length) return '';
      return `<div class="ss-group">${items.map(([id, label, ic, color]) => `<button class="ss-item ${id === ssPane ? 'active' : ''}" data-pane="${id}">${tileIc(ic, color, '', 13)}<span>${label}</span></button>`).join('')}</div>`;
    }).join('')}`;
  const b = settingsBody();
  $('.ss-top .crumb', el).textContent = b.crumb;
  $('.ss-content', el).innerHTML = b.html;
  $('[data-nav=back]', el).disabled = !ssHist.length;
  $('[data-nav=fwd]', el).disabled = !ssFwd.length;
}

function refreshSettings() { if (wins.settings) { const st = $('.ss-main', wins.settings).scrollTop; renderSettings(wins.settings); $('.ss-main', wins.settings).scrollTop = st; } }

function goSettings(pane, sub = null) {
  ssHist.push([ssPane, ssSub]); ssFwd = [];
  ssPane = pane; ssSub = sub;
  renderSettings(wins.settings);
  $('.ss-main', wins.settings).scrollTop = 0;
}

function openSettings(pane = 'general') {
  if (wins.settings) {
    if (+wins.settings.dataset.ws !== S.ws) switchWorkspace(+wins.settings.dataset.ws);
    focusWin(wins.settings);
    if (pane !== ssPane || ssSub) goSettings(pane);
    return;
  }
  ssPane = pane; ssSub = null; ssHist = []; ssFwd = [];
  const H = Math.min(640, window.innerHeight - 90);
  const el = makeWindow('settings', `<div class="win settings" style="height:${H}px">
    <aside class="ss-side">
      <div class="titlebar" data-drag>${lights()}</div>
      <label class="ss-search">${icon('search', 14)}<input placeholder="Search" spellcheck="false"></label>
      <div class="ss-nav"></div>
    </aside>
    <section class="ss-main">
      <div class="ss-top" data-drag>
        <button class="nav-btn" data-nav="back">${icon('chevL', 18)}</button>
        <button class="nav-btn" data-nav="fwd">${icon('chevR', 18)}</button>
        <span class="crumb"></span>
      </div>
      <div class="ss-content"></div>
    </section>
  </div>`, { max: true });
  renderSettings(el);
  $('.ss-search input', el).addEventListener('input', () => renderSettings(el));
  el.addEventListener('click', (e) => {
    const p = e.target.closest('[data-pane]');
    if (p) return goSettings(p.dataset.pane);
    const sp = e.target.closest('[data-sub-page]');
    if (sp) return goSettings(ssPane, sp.dataset.subPage);
    const nb = e.target.closest('[data-nav]');
    if (nb && !nb.disabled) {
      if (nb.dataset.nav === 'back') { ssFwd.push([ssPane, ssSub]); [ssPane, ssSub] = ssHist.pop(); }
      else { ssHist.push([ssPane, ssSub]); [ssPane, ssSub] = ssFwd.pop(); }
      return renderSettings(el);
    }
    const ac = e.target.closest('[data-accent]');
    if (ac) { setAccent(ac.dataset.accent); return; }
    const wl = e.target.closest('[data-wall]');
    if (wl) { S.wall = wl.dataset.wall; document.body.dataset.wall = S.wall; refreshSettings(); }
  });
}

function setAccent(name) {
  S.accent = name;
  document.documentElement.style.setProperty('--accent', `var(--${name})`);
  refreshSettings();
}

/* ============================================================
   Overlays
   ============================================================ */
function showDialog(kind) {
  const cfg = {
    restart: ['restart', 'Are you sure you want to restart your computer now?', 'Restart', 'primary'],
    shutdown: ['power', 'Are you sure you want to shut down your computer now?', 'Shut Down', 'danger'],
    logout: ['logout', `Are you sure you want to quit all applications and log out ${USER.name}?`, 'Log Out', 'primary'],
  }[kind];
  let left = 60;
  const el = h(`<div class="dim"><div class="dialog">
    <div class="d-ic">${icon(cfg[0], 26)}</div>
    <h4>${cfg[1]}</h4>
    <p>If you do nothing, the system will ${cfg[2].toLowerCase()} automatically in <span class="mono cd">${left}</span> seconds.</p>
    <div class="d-acts"><button class="btn" data-x>Cancel</button><button class="btn ${cfg[3]}" data-x>${cfg[2]}</button></div>
  </div></div>`);
  $('#overlay').appendChild(el);
  const t = setInterval(() => { left--; const c = $('.cd', el); if (c) c.textContent = left; if (left <= 0) clearInterval(t); }, 1000);
  el.addEventListener('click', (e) => { if (e.target === el || e.target.closest('[data-x]')) { clearInterval(t); el.remove(); } });
}

function showLock() {
  const d = new Date();
  const el = h(`<div class="lockscreen">
    <div class="lk-bg" style="background:inherit"></div><div class="lk-blur"></div>
    <div class="lk-inner"><div class="lk-date">${fmtDate(d)}</div><div class="lk-time">${fmtTime(d)}</div></div>
    <div class="lk-user"><div class="avatar">${USER.initials}</div><b>${USER.name}</b>
      <div class="lk-pass"><input type="password" placeholder="Enter Password"><button>${icon('chevR', 14)}</button></div>
      <span class="lk-hint">Press Enter to unlock (any password works in this demo)</span></div>
  </div>`);
  $('#overlay').appendChild(el);
  const inp = $('input', el); setTimeout(() => inp.focus(), 50);
  const unlock = () => el.remove();
  inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') unlock(); });
  $('.lk-pass button', el).addEventListener('click', unlock);
}

function showSleep() {
  const el = h(`<div class="sleep">Click anywhere to wake</div>`);
  $('#overlay').appendChild(el);
  setTimeout(() => el.addEventListener('click', () => el.remove()), 300);
}

/* ============================================================
   Live dummy data
   ============================================================ */
function tick() {
  const walk = (v, step, lo, hi) => clamp(v + rnd(-step, step), lo, hi);
  S.cpu = walk(S.cpu, 6, 3, 85);
  S.cpuT = clamp(38 + S.cpu * 0.45 + rnd(-1.5, 1.5), 36, 92);
  S.ram = walk(S.ram, 0.8, 30, 70);
  S.ramT = walk(S.ramT, 0.4, 36, 48);
  S.gpu = walk(S.gpu, 5, 1, 95);
  S.gpuT = clamp(36 + S.gpu * 0.4 + rnd(-1, 1), 34, 84);
  S.cores = S.cores.map(c => clamp(c * 0.5 + S.cpu * 0.5 + rnd(-18, 18), 1, 100));
  S.hist.push(S.cpu); S.hist.shift();
  S.net.down = clamp(S.net.down + rnd(-.6, .6), .05, 12);
  S.net.up = clamp(S.net.up + rnd(-30, 30), 4, 900);
  renderStatsChip();
  if (openName === 'stats') refreshPanel();
}

/* ---------- Boot ---------- */
document.body.dataset.wall = S.wall;
renderBar();
openTerminal();
openApps();
syncWorkspace();
setInterval(renderClock, 1000);
setInterval(tick, 1600);

// Deep links for screenshots/demo: index.html#about, #settings, #settings/appearance, #stats, #quick, #arch, #lock
(function deepLink() {
  let [a, b] = location.hash.slice(1).split('/');
  if (/^ws\d+$/.test(a || '')) { switchWorkspace(+a.slice(2)); a = b; b = undefined; }
  if (!a) return;
  if (a === 'about') openWindow('about');
  else if (a === 'settings') openSettings(b || 'general');
  else if (a === 'lock') showLock();
  else if (a === 'forcequit') openWindow('forcequit');
  else {
    const trig = $(`[data-panel="${a.replace('menu-', 'menu:')}"]`);
    if (trig) setTimeout(() => openPanel(trig.dataset.panel, trig), 50);
  }
  if (b && a !== 'settings') {
    const trig = $(`[data-panel="${b}"]`);
    if (trig) setTimeout(() => openPanel(trig.dataset.panel, trig), 60);
  }
})();
